<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voilenta License Desk</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#eee;background:#141414;font:15px/1.55 'Segoe UI',sans-serif}header{padding:17px 6%;border-bottom:1px solid #333;display:flex;align-items:center;gap:12px}.mark{color:#5ee5a5;font-weight:800}main{max-width:900px;margin:auto;padding:65px 24px}h1{font-size:42px;letter-spacing:-.045em;margin:0 0 6px}h2{font-size:19px;margin:0 0 16px}p{color:#b0b0b0;margin:0 0 24px}.card{margin-top:24px;border:1px solid #353535;background:#1c1c1c;border-radius:12px;padding:26px}label{display:grid;gap:6px;font-weight:600}input,select,button,textarea{font:inherit;border-radius:7px;padding:10px 12px}input,select,textarea{width:100%;border:1px solid #424242;background:#151515;color:#eee}button{border:1px solid #347759;background:#196443;color:#fff;cursor:pointer;font-weight:600}button:hover{background:#247c55}button:disabled{opacity:.55;cursor:wait}.secondary{background:#282828;border-color:#444}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#status{min-height:26px;margin:12px 0 0;color:#c6dfd2}textarea{margin:12px 0;min-height:180px;font-family:Consolas,monospace}details{margin-top:20px;color:#aaa}summary{cursor:pointer;margin-bottom:10px}[hidden]{display:none!important}@media(max-width:570px){main{padding-top:32px}.grid{grid-template-columns:1fr}h1{font-size:34px}}
</style>
<header><span class="mark">◆</span><strong>VOILENTA</strong><span style="color:#aaa">/ License Desk</span></header>
<main><h1>License keys</h1><p>Issue one-PC licenses for Voilenta’s Windows installer.</p>
<section class="card" id="signin"><h2>Team sign-in</h2><form id="login"><div class="grid"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label></div><button>Sign in</button><details id="connection"><summary>Supabase connection</summary><label>Project publishable key<input id="publicKey" placeholder="sb_publishable_…" spellcheck="false" autocomplete="off"></label></details></form></section>
<section class="card" id="desk" hidden><h2>Generate a batch</h2><p id="account"></p><form id="issue"><div class="grid"><label>Number of keys<input id="count" type="number" min="1" max="50" value="20" required></label><label>Valid after first activation<select id="duration"><option value="60">1 hour</option><option value="1440">1 day</option><option value="10080">7 days</option><option value="43200">30 days</option><option value="">Lifetime</option></select></label></div><div class="actions"><button>Generate keys</button><button type="button" class="secondary" id="logout">Sign out</button></div></form></section>
<p id="status" role="status" aria-live="polite"></p>
<section class="card" id="results" hidden><h2>Generated keys</h2><p>Copy these now. The database stores only their references.</p><textarea id="keys" aria-label="Generated keys and references" readonly></textarea><button id="copy">Copy keys</button></section></main>
<script>
'use strict';
const project='https://whoubwpfbplsuobxuncw.supabase.co';
const byId=id=>document.getElementById(id);
let token='', apiKey='', batch=[];
function notice(message){byId('status').textContent=message;}
function publishable(value){
  if(/^sb_publishable_[A-Za-z0-9_-]+$/.test(value))return true;
  try{return JSON.parse(atob(value.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role==='anon';}
  catch{return false;}
}
async function request(route,data,accessToken){
  const headers={'Content-Type':'application/json',apikey:apiKey};
  if(accessToken)headers.Authorization='Bearer '+accessToken;
  const response=await fetch(project+route,{method:'POST',headers,body:JSON.stringify(data),signal:AbortSignal.timeout(15000)});
  const result=await response.json();
  if(!response.ok)throw Error(result.message||result.msg||result.error_description||'Request failed.');
  return result;
}
byId('login').onsubmit=async event=>{
  event.preventDefault();
  apiKey=byId('publicKey').value.trim();
  if(!publishable(apiKey)){byId('connection').open=true;notice('Enter the Supabase publishable key.');return;}
  const button=event.currentTarget.querySelector('button');
  button.disabled=true;notice('Signing in…');
  try{
    const auth=await request('/auth/v1/token?grant_type=password',{email:byId('email').value,password:byId('password').value});
    token=auth.access_token;byId('password').value='';byId('signin').hidden=true;byId('desk').hidden=false;
    byId('account').textContent=auth.user.email;notice('');
  }catch(error){notice(error.message);}finally{button.disabled=false;}
};
byId('issue').onsubmit=async event=>{
  event.preventDefault();
  const button=event.currentTarget.querySelector('button');
  button.disabled=true;byId('logout').disabled=true;notice('Generating keys…');
  try{
    const duration=byId('duration').value;
    batch=await request('/rest/v1/rpc/voilenta_issue_keys',{p_count:Number(byId('count').value),p_minutes:duration?Number(duration):null},token);
    byId('keys').value=batch.map(row=>row.license_key+'  '+row.key_reference).join('\n');
    byId('results').hidden=false;notice(batch.length+' keys generated.');
  }catch(error){notice(error.message);}finally{button.disabled=false;byId('logout').disabled=false;}
};
byId('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(batch.map(row=>row.license_key).join('\n'));notice('Keys copied.');}
  catch{byId('keys').select();notice('Press Ctrl+C to copy the selected keys and references.');}
};
byId('logout').onclick=()=>{token='';batch=[];byId('keys').value='';byId('account').textContent='';byId('signin').hidden=false;byId('desk').hidden=true;byId('results').hidden=true;notice('Signed out.');};
</script></html>
