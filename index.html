<script>
'use strict';
const project='https://whoubwpfbplsuobxuncw.supabase.co';
const byId=id=>document.getElementById(id);
const apiKey='sb_publishable_TEPwpCgXCmBj8RloCP8xrA_nsLWIiag';
const loginEmail='voilenta@voilenta-license-desk.onrender.com';
let token='', batch=[];
const sessionKey='voilenta-license-session';
let refreshTimer;
function forgetSession(){
  clearTimeout(refreshTimer);
  try{localStorage.removeItem(sessionKey);}catch{}
}
function acceptSession(auth,remember){
  token=auth.access_token;
  clearTimeout(refreshTimer);
  if(!remember)return;
  try{localStorage.setItem(sessionKey,auth.refresh_token);}catch{}
  refreshTimer=setTimeout(()=>refreshSession(auth.refresh_token,auth.access_token),
    Math.max(1000,(auth.expires_in-60)*1000));
}
async function refreshSession(refreshToken,previousToken){
  try{
    const auth=await request('/auth/v1/token?grant_type=refresh_token',{refresh_token:refreshToken});
    if(token!==previousToken)return;
    acceptSession(auth,true);
    byId('signin').hidden=true;
    byId('desk').hidden=false;
    byId('account').textContent='Signed in as voilenta';
    notice('');
    loadHistory();
  }catch{
    if(token!==previousToken)return;
    forgetSession();
    byId('logout').click();
    notice('Sign in again to continue.');
  }
}
function notice(message){byId('status').textContent=message;}
async function request(route,data,accessToken){
  const headers={'Content-Type':'application/json',apikey:apiKey};
  if(accessToken)headers.Authorization='Bearer '+accessToken;
  const response=await fetch(project+route,{method:'POST',headers,body:JSON.stringify(data),signal:AbortSignal.timeout(15000)});
  const body=await response.text();
  const result=body?JSON.parse(body):null;
  if(!response.ok)throw Error(result?.message||result?.msg||result?.error_description||'Request failed ('+response.status+').');
  return result;
}
byId('login').onsubmit=async event=>{
  event.preventDefault();
  if(byId('username').value.trim().toLowerCase()!=='voilenta'){notice('Incorrect username or password.');return;}
  const button=event.currentTarget.querySelector('button');
  button.disabled=true;notice('Signing in…');
  try{
    const auth=await request('/auth/v1/token?grant_type=password',{email:loginEmail,password:byId('password').value});
    acceptSession(auth,byId('remember').checked);byId('password').value='';byId('signin').hidden=true;byId('desk').hidden=false;
    byId('account').textContent='Signed in as voilenta';notice('');loadHistory();
  }catch(error){notice(error.message);}finally{button.disabled=false;}
};
byId('duration').onchange=()=>{
  const custom=byId('duration').value==='custom';
  byId('customDuration').hidden=!custom;
  byId('amount').disabled=!custom;
};
function showBatch(rows){
  const cards=rows.map((row,index)=>{
    const card=document.createElement('article');
    card.className='key-card';
    const keyLabel=document.createElement('small');
    keyLabel.textContent='License key '+(index+1);
    const key=document.createElement('code');
    key.className='key-value'; key.textContent=row.license_key;
    const referenceLabel=document.createElement('small');
    referenceLabel.textContent='Key reference';
    const reference=document.createElement('code');
    reference.className='reference'; reference.textContent=row.key_reference;
    card.append(keyLabel,key,referenceLabel,reference);
    return card;
  });
  byId('keys').replaceChildren(...cards);
}
byId('issue').onsubmit=async event=>{
  event.preventDefault();
  const button=event.currentTarget.querySelector('button');
  button.disabled=true;byId('logout').disabled=true;notice('Generating keys…');
  try{
    const duration=byId('duration').value;
    const minutes=duration==='custom'?Number(byId('amount').value)*Number(byId('unit').value):duration?Number(duration):null;
    if(minutes!==null&&(!Number.isInteger(minutes)||minutes<1||minutes>525600))throw Error('Choose a duration from 1 minute to 365 days.');
    batch=await request('/rest/v1/rpc/voilenta_issue_keys',{p_count:Number(byId('count').value),p_minutes:minutes},token);
    for(const row of batch)issuedKeys.set(row.key_reference,row.license_key);
    showBatch(batch);
    byId('results').hidden=false;notice(batch.length+' keys generated.');loadHistory();
  }catch(error){notice(error.message);}finally{button.disabled=false;byId('logout').disabled=false;}
};
byId('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(batch.map(row=>row.license_key).join('\n'));notice('Keys copied.');}
  catch{notice('Clipboard access is unavailable. Select a license key to copy it manually.');}
};
byId('logout').onclick=()=>{forgetSession();token='';batch=[];clearHistory();byId('keys').replaceChildren();byId('account').textContent='';byId('signin').hidden=false;byId('desk').hidden=true;byId('results').hidden=true;notice('Signed out.');};
let historyRequest=0;
let displayedKeys=[];
const issuedKeys=new Map();

function clearHistory(){
  issuedKeys.clear();
  displayedKeys=[];
  byId('historyRows').replaceChildren();
  byId('historyTable').hidden=true;
  byId('history').hidden=true;
}
function updateStatus({key,status,remaining}){
  const minutes=key.expires_at===null?null:Math.ceil((Date.parse(key.expires_at)-Date.now())/60000);
  let label='Active';
  if(key.revoked)label='Revoked';
  else if(!key.activated_at)label='Awaiting activation';
  else if(minutes!==null&&minutes<=0)label='Expired';
  status.textContent=label;
  status.classList.toggle('active',label==='Active');
  if(label!=='Active'){remaining.textContent='—';return;}
  if(minutes===null){remaining.textContent='Lifetime';return;}
  const days=Math.floor(minutes/1440);
  const hours=Math.floor(minutes/60)%24;
  remaining.textContent=[days?days+'d':'',hours?hours+'h':'',minutes%60+'m'].filter(Boolean).join(' ');
}
async function manageKey(key,action,button){
  let minutes=null;
  if(action==='duration'){
    const value=prompt(key.activated_at
      ? 'Minutes remaining from now (or type lifetime)'
      : 'Minutes after first activation (or type lifetime)');
    if(value===null)return;
    if(value.trim().toLowerCase()!=='lifetime'){
      minutes=Number(value);
      if(!Number.isInteger(minutes)||minutes<1||minutes>525600){
        byId('historyStatus').textContent='Enter 1 to 525600 minutes, or lifetime.';
        return;
      }
    }
  }else if(action==='revoke'&&!confirm('Ban this key?'))return;
  const accessToken=token;
  button.disabled=true;
  try{
    await request('/rest/v1/rpc/voilenta_manage_key',{
      p_reference:key.key_reference,p_action:action,p_minutes:minutes
    },accessToken);
    if(token!==accessToken)return;
    if(action==='remove'||action==='revoke'){
      batch=batch.filter(row=>row.key_reference!==key.key_reference);
      showBatch(batch);
      byId('results').hidden=batch.length===0;
      if(action==='remove')issuedKeys.delete(key.key_reference);
    }
    await loadHistory(action==='remove'?(key.activated_at?'Key expired.':'Key removed.'):action==='revoke'?'Key banned.':'Duration updated.');
  }catch(error){
    if(token===accessToken){
      const missing=error.message.includes('Could not find the function');
      byId('historyStatus').textContent=missing
        ? 'Run voilenta_manage_key.sql in Supabase to enable key actions.'
        : 'Key action failed: '+error.message;
    }
  }finally{
    button.disabled=false;
  }
}
async function loadHistory(successMessage=''){
  const accessToken=token;
  const requestId=++historyRequest;
  const isCurrent=()=>token===accessToken&&historyRequest===requestId;
  byId('history').hidden=false;
  byId('refresh').disabled=true;
  byId('historyStatus').textContent='Loading key history…';
  try{
    const keys=await request('/rest/v1/rpc/voilenta_list_keys',{},accessToken);
    if(!isCurrent())return;
    displayedKeys=keys.map(key=>{
      const row=document.createElement('tr');
      const reference=document.createElement('code');
      reference.textContent=key.key_reference;
      reference.style.overflowWrap='anywhere';
      const details=document.createElement('details');
      const summary=document.createElement('summary');
      const fullKey=issuedKeys.get(key.key_reference);
      reference.textContent=fullKey??key.key_reference;
      summary.append(reference);
      summary.style.cursor='pointer';
      summary.style.color='#8af4bd';
      details.append(summary);
      const fields=[
        ['License key',fullKey??'Original key unavailable. Supabase stores its reference.'],
        ['Key reference',key.key_reference],
        ['Issued',key.issued_at?new Date(key.issued_at).toLocaleString():'Unknown'],
        ['Device fingerprint (hashed HWID)',Object.hasOwn(key,'device_hash')
          ? key.device_hash??'No device recorded'
          : 'Run the updated key-history SQL to show device fingerprints.'],
        ['Activated',key.activated_at?new Date(key.activated_at).toLocaleString():'Awaiting activation'],
        ['Expires',key.expires_at?new Date(key.expires_at).toLocaleString():(key.activated_at?'Lifetime':'Starts at activation')]
      ];
      for(const [label,value] of fields){
        const field=document.createElement('div');
        field.textContent=label+': '+value;
        field.style.overflowWrap='anywhere';
        details.append(field);
      }
      row.insertCell().append(details);
      row.insertCell().textContent=key.issued_at?new Date(key.issued_at).toLocaleString():'—';
      const entry={key,row,status:row.insertCell(),remaining:row.insertCell()};
      const actions=row.insertCell();
      const controls=[];
      if(!key.activated_at||(!key.revoked&&(!key.expires_at||Date.parse(key.expires_at)>Date.now()))){
        controls.push(['remove','Remove']);
      }
      if(!key.revoked)controls.push(['revoke','Ban'],['duration','Change duration']);
      for(const [action,label] of controls){
        const button=document.createElement('button');
        button.type='button';
        button.className='secondary';
        button.textContent=label;
        button.onclick=()=>manageKey(key,action,button);
        actions.append(button);
      }
      updateStatus(entry);
      return entry;
    });
    byId('historyRows').replaceChildren(...displayedKeys.map(entry=>entry.row));
    byId('historyTable').hidden=keys.length===0;
    byId('historyStatus').textContent=[successMessage,keys.length?'':'No keys have been issued.'].filter(Boolean).join(' ');
  }catch(error){
    if(isCurrent())byId('historyStatus').textContent=[successMessage,'Could not load key history. '+error.message].filter(Boolean).join(' ');
  }finally{
    if(isCurrent())byId('refresh').disabled=false;
  }
}
byId('refresh').onclick=()=>loadHistory();
setInterval(()=>displayedKeys.forEach(updateStatus),1000);
try{
  const savedSession=localStorage.getItem(sessionKey);
  if(savedSession){
    byId('remember').checked=true;
    const signInButton=byId('login').querySelector('button');
    signInButton.disabled=true;
    refreshSession(savedSession,token).finally(()=>{signInButton.disabled=false;});
  }
}catch{}
</script></html>
